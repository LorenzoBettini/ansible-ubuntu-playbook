---
dependency:
  name: galaxy
driver:
  name: docker
lint: |
  set -e
  yamllint .
  ansible-lint
platforms:
  - name: ubuntu-jammy-instance
    image: ubuntu-jammy-ansible
    dockerfile: ./Dockerfile
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: ../default/verify.yml
